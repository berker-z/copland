[workspace]
members = ["core", "cli", "box"]
# The box needs GPUI and its native libraries (see flake.nix); plain `cargo build`
# and `cargo test` here stay the headless daemon. `--workspace` takes in the box.
default-members = ["core", "cli"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "MIT"
authors = ["berker-z"]
rust-version = "1.85"

[workspace.dependencies]
copland-daemon-core = { path = "core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "sync", "fs", "io-util"] }
# rustls with ring, not the default aws-lc-rs: no cmake or system OpenSSL needed.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
anyhow = "1"
# Already in the graph through rustls; named here for the live socket's handshake (SHA-1 and
# randomness, COPL-62). Exact, so it never moves on its own.
ring = { version = "=0.17.14", default-features = false }
