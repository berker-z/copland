[package]
name = "copland-box"
description = "The Copland daemon with a window: the agents' loop, drawn as wires and poles"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "copland-box"
path = "src/main.rs"

[dependencies]
copland-daemon-core.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
# Exact, and frozen once the box settles (AGENTS.md). 0.2.2 is the newest GPUI
# on crates.io; all of its own dependencies come from crates.io too, so the
# whole graph is pinned by this line and Cargo.lock.
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "x11", "font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Desktop notifications over D-Bus (org.freedesktop.Notifications, COPL-64). Already in the
# graph through GPUI (oo7, ashpd), exactly this version with these features, so naming it
# here adds no crate and moves nothing; exact, so it never moves on its own. Async API on
# async-io, which GPUI enables already; no blocking-api, no tokio feature.
zbus = { version = "=5.13.2", default-features = false, features = ["async-io"] }
