# Checks every pull request, the floor under the drift check (COPL-75,
# docs/GITHUB.md): typecheck, the checks and the build, as AGENTS.md asks
# before a commit, and the headless daemon's tests and lints when the PR
# touches daemon/. One job, `ci`, so branch protection has one name to
# require; the daemon part is skipped, not left pending, on PRs that don't
# touch it. The box (daemon/box) needs GPUI's native libraries and is checked
# by box-release.yml under Nix instead. `macos` runs the daemon's tests on a
# Mac too, for its sandbox (COPL-140). Both install Codex, pinned, and require
# its sandbox tests (COPL-143), which run `codex sandbox` with the policy the
# daemon gives Codex's runs: no model, no account. `nix` runs the daemon
# flake's checks when a PR touches its Nix files (COPL-217). `linux-install`
# installs the daemon as a user would, on the runner and in Arch, Fedora and
# Ubuntu containers, when a PR touches daemon/ (COPL-220).

name: ci

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR makes the run for the old one pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # The check runs TypeScript through node's type stripping (22.18+).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      # Rows read per route against checks/reads.budgets.ts, on a local D1 (COPL-149).
      - run: npm run check:reads
      - run: npm run build

      - name: Does it touch daemon/?
        id: daemon
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- daemon/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.daemon.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.daemon.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # Codex's Linux sandbox is bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu 24.04's AppArmor keeps them from it otherwise.
      - if: steps.daemon.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm i -g @openai/codex@0.159.2
      - if: steps.daemon.outputs.changed == 'true'
        working-directory: daemon
        env:
          COPLAND_TEST_CODEX: "1"
        run: cargo test && cargo clippy --all-targets -- -D warnings

  # The daemon on a Mac (COPL-140): its tests there run a command inside the
  # Seatbelt sandbox that writes inside the worktree and fails outside it,
  # which nobody can try on a real Mac. Only on PRs that touch daemon/.
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does it touch daemon/?
        id: daemon
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- daemon/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.daemon.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.daemon.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - if: steps.daemon.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: steps.daemon.outputs.changed == 'true'
        run: npm i -g @openai/codex@0.159.2
      - if: steps.daemon.outputs.changed == 'true'
        working-directory: daemon
        env:
          COPLAND_TEST_CODEX: "1"
        run: cargo test && cargo clippy --all-targets -- -D warnings

  # The Linux install as INSTALL-linux.txt has a user do it (COPL-220,
  # daemon/ci/install-flow.sh): the tarball's copy refused, the copy in
  # ~/.local/bin installed, the unit stable, verified by systemd-analyze and
  # left alone when run again, runtimes found off PATH. On the runner, as a new
  # user with a real systemd user manager (lingering), so the service is
  # started and removed too; then in Arch (Omarchy's base), Fedora and Ubuntu
  # containers, which have no user manager, so only the unit is written there.
  # The daemon is built once, here: it needs only glibc, and the runner's (Ubuntu
  # 24.04, 2.39) is no newer than any of the three images'. Only on PRs that
  # touch daemon/.
  linux-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does it touch daemon/?
        id: daemon
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- daemon/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.daemon.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.daemon.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - if: steps.daemon.outputs.changed == 'true'
        working-directory: daemon
        run: cargo build -p copland-daemon
      # Somewhere every user (and container) can read: the binary, the script
      # and the release files it installs.
      - if: steps.daemon.outputs.changed == 'true'
        run: |
          sudo mkdir -p /opt/copland
          sudo cp -r daemon/ci daemon/release /opt/copland/
          sudo install -m 755 daemon/target/debug/copland-daemon /opt/copland/copland-daemon
      - if: steps.daemon.outputs.changed == 'true'
        name: On the runner, with systemd's user manager
        run: |
          sudo useradd -m -s /bin/bash ci
          uid=$(id -u ci)
          sudo loginctl enable-linger ci
          for _ in $(seq 60); do [ -S /run/user/$uid/bus ] && break; sleep 1; done
          [ -S /run/user/$uid/bus ] || { echo "no user manager for ci after 60s"; exit 1; }
          # A login's environment, not the runner's (its XDG_CONFIG_HOME is /home/runner's).
          sudo -u ci env -i HOME=/home/ci USER=ci LOGNAME=ci SHELL=/bin/bash \
            PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            XDG_RUNTIME_DIR=/run/user/$uid \
            bash /opt/copland/ci/install-flow.sh /opt/copland/copland-daemon manager
      - if: steps.daemon.outputs.changed == 'true'
        name: In Arch, Fedora and Ubuntu containers
        run: |
          for image in archlinux:latest fedora:latest ubuntu:24.04; do
            echo "::group::$image"
            id=$(docker run -d -v /opt/copland:/opt/copland:ro "$image" sleep infinity)
            docker exec "$id" sh -c 'command -v useradd >/dev/null || dnf -y -q install shadow-utils'
            docker exec "$id" useradd -m ci
            docker exec --user ci -e HOME=/home/ci -w /home/ci "$id" \
              bash /opt/copland/ci/install-flow.sh /opt/copland/copland-daemon
            docker rm -f "$id" >/dev/null
            echo "::endgroup::"
          done

  # The daemon flake's checks (COPL-217): its home-manager module evaluated
  # in a home configuration and the units it renders compared with
  # release/copland-daemon.service (daemon/nix/checks.nix). The checks use a
  # stub package, so this builds no GPUI and needs no cache; `nix flake
  # check` only evaluates the real package. Only on PRs that touch the Nix
  # files or the shipped unit.
  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does it touch the flake?
        id: flake
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- 'daemon/flake.*' daemon/nix/ daemon/release/copland-daemon.service | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.flake.outputs.changed == 'true'
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - if: steps.flake.outputs.changed == 'true'
        run: nix flake check -L ./daemon
