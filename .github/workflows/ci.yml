# Checks every pull request, the floor under the drift check (COPL-75,
# docs/GITHUB.md): typecheck, the checks and the build, as AGENTS.md asks
# before a commit, and the headless daemon's tests and lints when the PR
# touches daemon/. One job, `ci`, so branch protection has one name to
# require; the daemon part is skipped, not left pending, on PRs that don't
# touch it. The box (daemon/box) needs GPUI's native libraries and is checked
# by box-release.yml under Nix instead. `macos` runs the daemon's tests on a
# Mac too, for its sandbox (COPL-140). Both install Codex, pinned, and require
# its sandbox tests (COPL-143), which run `codex sandbox` with the policy the
# daemon gives Codex's runs: no model, no account. Both install Factory's droid
# too, pinned by version and checksum, for the test of droid's own sandbox
# (COPL-146), which fails rather than skips here (COPLAND_REQUIRE_DROID).

name: ci

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR makes the run for the old one pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Moved by hand, with the checksums below, when droid's sandbox test needs a newer one.
  DROID_VERSION: 0.233.0

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          # The check runs TypeScript through node's type stripping (22.18+).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run build

      - name: Does it touch daemon/?
        id: daemon
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- daemon/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.daemon.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.daemon.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      # Codex's Linux sandbox is bubblewrap, which needs unprivileged user
      # namespaces; Ubuntu 24.04's AppArmor keeps them from it otherwise.
      - if: steps.daemon.outputs.changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm i -g @openai/codex@0.159.2
      # droid's sandbox is bubblewrap too, and needs socat besides.
      - if: steps.daemon.outputs.changed == 'true'
        name: socat and droid, for droid's sandbox test
        run: |
          sudo apt-get install -y --no-install-recommends socat
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/droid" "https://downloads.factory.ai/factory-cli/releases/$DROID_VERSION/linux/x64/droid"
          echo "744a5c500a9422b18a7355cf8b824d5d21d4b65d2e48d74f0f1ee4b6d92f7ab8  $RUNNER_TEMP/bin/droid" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bin/droid"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: steps.daemon.outputs.changed == 'true'
        working-directory: daemon
        env:
          COPLAND_TEST_CODEX: "1"
          COPLAND_REQUIRE_DROID: "1"
        run: cargo test && cargo clippy --all-targets -- -D warnings

  # The daemon on a Mac (COPL-140): its tests there run a command inside the
  # Seatbelt sandbox that writes inside the worktree and fails outside it,
  # which nobody can try on a real Mac. Only on PRs that touch daemon/.
  macos:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Does it touch daemon/?
        id: daemon
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || git diff --name-only "$base" HEAD -- daemon/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.daemon.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - if: steps.daemon.outputs.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - if: steps.daemon.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - if: steps.daemon.outputs.changed == 'true'
        run: npm i -g @openai/codex@0.159.2
      - if: steps.daemon.outputs.changed == 'true'
        name: droid, for its sandbox test
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/droid" "https://downloads.factory.ai/factory-cli/releases/$DROID_VERSION/darwin/arm64/droid"
          echo "0e0bf625f7c45ade78fb5e11efcccaf4bcd00d53414e8e82b76c62969d0c1e34  $RUNNER_TEMP/bin/droid" | shasum -a 256 -c
          chmod +x "$RUNNER_TEMP/bin/droid"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - if: steps.daemon.outputs.changed == 'true'
        working-directory: daemon
        env:
          COPLAND_TEST_CODEX: "1"
          COPLAND_REQUIRE_DROID: "1"
        run: cargo test && cargo clippy --all-targets -- -D warnings
