# Checks every pull request, the floor under the drift check (COPL-75,
# docs/GITHUB.md): typecheck, the checks and the build, as AGENTS.md asks
# before a commit. One job, `ci`, run on every PR, so branch protection has
# one name to require. The daemon has workflows of its own that run only when
# a PR changes what they test: daemon-ci.yml (its tests on Linux and macOS,
# and its install on both) and nix-ci.yml (the flake's checks). The box
# (daemon/box) needs GPUI's native libraries and is checked by
# box-release.yml under Nix instead.

name: ci

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR makes the run for the old one pointless.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The check runs TypeScript through node's type stripping (22.18+).
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      # Rows read per route against checks/reads.budgets.ts, on a local D1 (COPL-149).
      - run: npm run check:reads
      - run: npm run build
